[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formulate"
version = "0.1.0"
description = "Active learning for polymer formulation: find the best copolymer in the fewest experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["active-learning", "bayesian-optimization", "polymer", "formulation", "materials"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    # The evaluation harness (surrogate ensemble, GBM) and the copolymer oracle,
    # from GitHub. copolybench pulls polytools transitively; polytools is listed
    # too because this package imports it directly.
    "polytools[gbm] @ git+https://github.com/DrGregPitch/polytools",
    "copolybench @ git+https://github.com/DrGregPitch/copolybench",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/DrGregPitch/formulate"
Issues = "https://github.com/DrGregPitch/formulate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/formulate"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B905", "C408"]
