name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      # Install into a uv-managed venv (not the runner's externally-managed system
      # Python), then run everything through it. Pulls polytools from GitHub.
      - name: Create the environment and install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Run tests
        run: uv run pytest tests -v

      # The ablation is part of CI: a results script that silently rots is the
      # most common way a portfolio repo stops being reproducible.
      - name: Run the optimization end to end
        run: uv run python scripts/run_optimization.py --outdir /tmp/ci-results --n-pairs 30 --restarts 3 --budget 25 --no-figures

      - name: Check it produced results
        run: test -s /tmp/ci-results/experiments_to_target.md
